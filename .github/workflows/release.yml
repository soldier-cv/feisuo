name: Build and Release

# 仅 tag v* 或手动触发；普通 push 不发版
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          # 同 ci.yml：Swatinem/rust-cache 没有 `key` 输入，写了不生效。
          prefix-key: release

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # ⚠️ 必须与 ci.yml 锁**同一个具体版本**。
          #
          # 写 `version: 9` 是浮动 major：pnpm 10 发布后会自动升级，
          # 而它的 lockfile 格式与 9 不兼容 —— `--frozen-lockfile` 直接失败。
          # 在 CI 里那只是"检查挂了"，在这里是**发版失败、版本打不出来**，
          # 而发版失败的现场（"lockfile 不满足"）完全看不出是工具链变了。
          #
          # 升 pnpm 时: 两份 workflow 一起改 + 重新生成 `ui/pnpm-lock.yaml`
          #（当前 `lockfileVersion: '9.0'`，与 pnpm 9 配套）。
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 必须与 ci.yml 一致 —— 否则"CI 绿的版本"和"发版构建的版本"
          # 可能是两个不同的产物，而没人会发现。
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { throw "ANDROID_SDK_ROOT / ANDROID_HOME 都没设置" }
          $ndkVersion = '30.0.16248370'
          $sdkmanager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          if (-not (Test-Path $sdkmanager)) {
            throw "找不到 sdkmanager: $sdkmanager（镜像需要装 cmdline-tools）"
          }
          'y' | & $sdkmanager --licenses | Out-Null
          & $sdkmanager "ndk;$ndkVersion"
          if ($LASTEXITCODE -ne 0) { throw "安装 NDK $ndkVersion 失败" }
          $ndkHome = Join-Path $sdk "ndk/$ndkVersion"
          if (-not (Test-Path (Join-Path $ndkHome 'source.properties'))) {
            throw "NDK 目录存在但缺少 source.properties（安装不完整）: $ndkHome"
          }
          "ANDROID_NDK_HOME=$ndkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_NDK_ROOT=$ndkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "NDK: $ndkHome"

      # 版本号的**唯一来源**是 `Cargo.toml` 的 `CARGO_PKG_VERSION`（规则 6）。
      #
      # 早先这里写死 `$ver = '0.1.0'` 作为回退，于是有两个独立的坏结果：
      #   1. 规则 6 明确「任何位置不得写死版本字符串」，这行本身就是违规；
      #   2. tag 不是语义化版本时正则不匹配，**静默**回退到 0.1.0 ——
      #      推一个 `vnext` 标签会发出一个名为 vnext、内容却是 0.1.0 的
      #      Release，两处配置被一起改成 0.1.0，守卫全部通过，
      #      而所有在线用户从此永远收到「已是最新」。
      #
      # 现在：tag 存在时**必须**能解析出版本号，解析不出就失败。
      # 手动触发（无 tag）时从 Cargo.toml 读当前版本，那才是唯一来源。
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $cargo = Get-Content 'Cargo.toml' -Raw -Encoding UTF8
          if ($cargo -notmatch '(?m)^version = "([^"]+)"') {
            throw "Cargo.toml 里读不到版本号"
          }
          $fallback = $Matches[1]
          Write-Host "Cargo.toml 当前版本: $fallback"

          $ver = $fallback
          if ("${{ github.ref_type }}" -eq 'tag') {
            $raw = "${{ github.ref_name }}"
            $t = $raw -replace '^[vV]', ''
            if ($t -notmatch '^(\d+\.\d+\.\d+)') {
              # 刻意**硬失败**而不是回退：发一个内容与标签不符的 Release
              # 比不发糟糕得多 —— 它会静默地把所有用户的更新通道锁死。
              throw "标签 '$raw' 不是 v<major>.<minor>.<patch> 形式, 拒绝发版（避免发出内容与标签不符的包）"
            }
            $ver = $Matches[1]
            if ($ver -ne $fallback) {
              # 不是错误：仓库里的 Cargo.toml 本来就由 Stamp version 现场改写，
              # 不提交回仓库。tag 才是发版时的权威。
              Write-Host "以标签为准: $ver（仓库当前 $fallback）"
            }
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
          Write-Host "version=$ver"

      # 版本号必须同时写进 Cargo.toml 与 tauri.conf.json:
      #   * Cargo.toml -> CARGO_PKG_VERSION (updater 读它作为"当前版本")
      #   * tauri.conf.json -> tauri::AppHandle::package_info().version
      # 两处不一致会让"检查更新"永远认为无需更新或永远有更新。
      - name: Stamp version
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'

          $cargo = 'Cargo.toml'
          $text = Get-Content $cargo -Raw -Encoding UTF8
          # 只改 `[workspace.package]` 段里**第一处** `version`。
          #
          # PowerShell 的 `-replace` 是**全局**替换：一旦 Cargo.toml 以后长出
          # 第二处 `version = "..."`（比如给某个成员单独指定版本），
          # 这一行会把两处一起改掉，成员版本与工作区版本就分叉了，
          # 而 `CARGO_PKG_VERSION` 读的是成员自己的值 —— 于是改的正好不是
          # 真正生效的那一处，且没有任何报错。
          $rx = [regex]'(?m)^version = "[^"]+"'
          if (-not $rx.IsMatch($text)) { throw "Cargo.toml 里没有找到 version 字段" }
          $text = $rx.Replace($text, "version = `"$ver`"", 1)
          Set-Content -Path $cargo -Value $text -Encoding UTF8 -NoNewline

          # 刻意**不做** ConvertFrom-Json | ConvertTo-Json 往返：
          # productName / title 是中文，Windows PowerShell 5.1 的 JSON 往返
          # 会按系统代码页重新编码，把「飞梭」写成乱码并顺带重排整个文件。
          # 只定点替换 "version" 那一行，其余字节原样保留。
          $conf = 'desktop/src-tauri/tauri.conf.json'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $text = [System.IO.File]::ReadAllText((Resolve-Path $conf), [System.Text.Encoding]::UTF8)
          $rx = [regex]'("version"\s*:\s*")[^"]+(")'
          if (-not $rx.IsMatch($text)) { throw "tauri.conf.json 里没有找到 version 字段" }
          $updated = $rx.Replace($text, "`${1}$ver`${2}", 1)
          [System.IO.File]::WriteAllText((Resolve-Path $conf), $updated, $utf8)
          Write-Host "stamped version $ver"

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build UI
        run: pnpm --dir ui build

      # 必须与本地 README「手动编译」给出的**同一条构建命令**。
      #
      # 早先这里是 `cargo build --release -p feisuo-desktop`，与本地
      # `cargo tauri build --no-bundle` 不同：后者会带上 Tauri CLI 注入的
      # 构建期环境（`TAURI_ENV_*`、资源与图标处理）。两条路径的产物可能不同，
      # 而差异只会在用户下载之后才暴露 —— 本地怎么测都测不出来。
      #
      # "本地能跑通"与"发出去的能用"必须是同一件事，否则测试没有意义。
      - name: Build desktop executable
        shell: pwsh
        run: |
          cargo install tauri-cli --version "^2" --locked
          if ($LASTEXITCODE -ne 0) { throw "安装 tauri-cli 失败" }
          cargo tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "cargo tauri build 失败" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $env:FEISUO_VERSION = $ver
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          if (-not (Test-Path 'desktop/setup/languages/ChineseSimplified.isl')) {
            throw 'desktop/setup/languages/ChineseSimplified.isl missing'
          }
          & $iscc desktop/setup/Feisuo.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $setup = 'publish/Feisuo-Setup-x64.exe'
          if (-not (Test-Path $setup)) { throw "Installer missing: $setup" }
          $setupSize = (Get-Item $setup).Length
          Write-Host "Feisuo-Setup-x64.exe: $([math]::Round($setupSize / 1MB, 2)) MB"
          if ($setupSize -lt 1MB) { throw "安装包体积异常 ($setupSize 字节)，疑似打包失败" }

      # 与 README「三个守卫」第 1 条同源的复核：Stamp version 改了两处配置，
      # 这里**再读回来确认**它们真的相等。
      #
      # 放在 build 之后而不是 Stamp 之后：Stamp 里 `tauri.conf.json` 的
      # 正则替换只检查"有没有替换掉"（`$updated -eq $text`），
      # 不检查"替换成了什么"。万一它匹配到了另一个 `"version"` 字段
      # （比如某个 schema 里的），两处就悄悄分叉了 —— 而不一致的版本号
      # 会让检查更新**永久失灵**，且没有任何一处会报错。
      - name: Verify version stamp landed in both files
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $cargoText = Get-Content 'Cargo.toml' -Raw -Encoding UTF8
          $confText = [System.IO.File]::ReadAllText(
            (Resolve-Path 'desktop/src-tauri/tauri.conf.json'), [System.Text.Encoding]::UTF8)
          $vCargo = if ($cargoText -match '(?m)^version\s*=\s*"([^"]+)"') { $Matches[1] } else { $null }
          $vTauri = if ($confText -match '"version"\s*:\s*"([^"]+)"') { $Matches[1] } else { $null }
          if ($vCargo -ne $ver) { throw "Cargo.toml 版本是 '$vCargo'，期望 '$ver'" }
          if ($vTauri -ne $ver) { throw "tauri.conf.json 版本是 '$vTauri'，期望 '$ver'" }
          Write-Host "两处版本一致: $ver"

      # ---------------------------------------------------------------------------
      # Android: 交叉编译原生库并构建 Release APK
      # ---------------------------------------------------------------------------
      - name: Cross-compile Android libfeisuo_core.so
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ANDROID_NDK_HOME) { throw 'ANDROID_NDK_HOME 未设置（前序步骤应写入 GITHUB_ENV）' }
          $ndk = $env:ANDROID_NDK_HOME
          $triple = 'aarch64-linux-android'
          $api = 21   # minSdk 是 26；取更低无意义，取更高老系统直接加载失败
          $binDir = Join-Path $ndk "toolchains/llvm/prebuilt/windows-x86_64/bin"
          $linker = Join-Path $binDir "aarch64-linux-android$api-clang.cmd"
          if (-not (Test-Path $linker)) { throw "找不到 NDK linker: $linker" }
          $llvmAr = Join-Path $binDir 'llvm-ar.exe'
          if (-not (Test-Path $llvmAr)) { $llvmAr = Join-Path $binDir 'llvm-ar' }

          $q = { param($p) if ($p.Contains("'")) { throw "路径含单引号: $p" }; "'$p'" }
          $toml = @(
            '# 由 CI 内联生成，请勿手工编辑；也不该提交（含本机 NDK 路径）。',
            "# NDK: $ndk",
            '',
            "[target.$triple]",
            "linker = $(&$q $linker)",
            $(if (Test-Path $llvmAr) { "ar = $(&$q $llvmAr)" }),
            'rustflags = [',
            '    "-C",',
            '    "link-arg=-Wl,-z,max-page-size=16384",',
            ']',
            '',
            '# cc-rs（rusqlite bundled 会编 C 代码）需要在 PATH 之外拿到目标平台 clang',
            '[env]',
            "CC_$(($triple -replace '-','_').ToUpper()) = $(&$q $linker)",
            $(if (Test-Path $llvmAr) { "AR_$(($triple -replace '-','_').ToUpper()) = $(&$q $llvmAr)" }),
            ''
          ) -join "`n"

          New-Item -ItemType Directory -Force -Path '.cargo' | Out-Null
          Set-Content -LiteralPath '.cargo/config.toml' -Value $toml -Encoding utf8

          & cargo build -p feisuo-core --target $triple --profile release --message-format short
          if ($LASTEXITCODE -ne 0) { throw "cargo build 失败（退出码 $LASTEXITCODE）" }

          $dest = 'mobile/android/app/src/main/jniLibs/arm64-v8a'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "target/$triple/release/libfeisuo_core.so" "$dest/libfeisuo_core.so" -Force
          $so = "$dest/libfeisuo_core.so"
          if (-not (Test-Path $so)) { throw "原生库缺失: $so" }
          Write-Host "OK $so ($([math]::Round((Get-Item $so).Length/1MB,2)) MB)"

      - name: Build Android release APK
        shell: pwsh
        working-directory: mobile/android
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          .\gradlew.bat assembleRelease --console=plain
          if ($LASTEXITCODE -ne 0) { throw "assembleRelease 失败" }
          $apk = Get-ChildItem 'app/build/outputs/apk/release' -Filter *.apk -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { throw '没找到 Release APK 产物' }

          $destDir = (Resolve-Path '../../publish').Path
          if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }
          $destApk = Join-Path $destDir "Feisuo-v${ver}-arm64.apk"
          Copy-Item $apk.FullName $destApk -Force
          $size = (Get-Item $destApk).Length
          Write-Host "Release APK: $destApk ($([math]::Round($size/1MB,2)) MB)"
          if ($size -lt 2MB) { throw "APK 只有 $([math]::Round($size/1KB,1)) KB，原生库很可能没打进去" }

      # 收集双形态产物与 Android APK：
      #  1. Feisuo-Setup-x64.exe (Windows 安装版，推荐)
      #  2. Feisuo-win-x64.exe (Windows 绿色单文件便携版)
      #  3. Feisuo-v${ver}-arm64.apk (Android 移动端)
      - name: Collect artifact
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $src = 'target/release/feisuo-desktop.exe'
          if (-not (Test-Path $src)) { throw "构建产物缺失: $src" }

          $stage = 'publish/Feisuo-win-x64.exe'
          New-Item -ItemType Directory -Force -Path 'publish' | Out-Null
          Copy-Item $src $stage -Force

          $size = (Get-Item $stage).Length
          Write-Host "Feisuo-win-x64.exe : $([math]::Round($size / 1MB, 2)) MB"
          if ($size -lt 1MB) { throw "产物体积异常 ($size 字节)，疑似构建失败" }

          $stageSetup = 'publish/Feisuo-Setup-x64.exe'
          if (-not (Test-Path $stageSetup)) { throw "Windows 安装包产物缺失: $stageSetup" }
          $setupSize = (Get-Item $stageSetup).Length
          Write-Host "Feisuo-Setup-x64.exe : $([math]::Round($setupSize / 1MB, 2)) MB"
          if ($setupSize -lt 1MB) { throw "安装包体积异常 ($setupSize 字节)，疑似构建失败" }

          $stageApk = "publish/Feisuo-v${ver}-arm64.apk"
          if (-not (Test-Path $stageApk)) { throw "Android APK 发布产物缺失: $stageApk" }
          $apkSize = (Get-Item $stageApk).Length
          Write-Host "Feisuo-v${ver}-arm64.apk : $([math]::Round($apkSize / 1MB, 2)) MB"
          if ($apkSize -lt 2MB) { throw "APK 体积异常 ($apkSize 字节)，疑似构建失败" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Feisuo-release-v${{ steps.ver.outputs.version }}
          path: |
            publish/Feisuo-Setup-x64.exe
            publish/Feisuo-win-x64.exe
            publish/Feisuo-v${{ steps.ver.outputs.version }}-arm64.apk
          if-no-files-found: error

      - name: Resolve release notes
        id: notes
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $notes = ''
          if (Test-Path 'CHANGELOG.md') {
            $lines = Get-Content 'CHANGELOG.md' -Encoding utf8
            $in = $false
            $buf = @()
            foreach ($l in $lines) {
              if ($l.Trim().StartsWith("## [$ver]") -or $l.Trim().StartsWith("## [v$ver]")) {
                $in = $true
                continue
              }
              if ($in) {
                if ($l.Trim() -match '^##\s+\[') { break }
                $buf += $l
              }
            }
            $notes = ($buf -join [Environment]::NewLine).Trim()

            # 首发版本或尚未从 [未发布] 归档时，回退提取 [未发布] 节
            if ([string]::IsNullOrWhiteSpace($notes)) {
              $inUnreleased = $false
              $unreleasedBuf = @()
              foreach ($l in $lines) {
                if ($l.Trim().StartsWith('## [未发布]') -or $l.Trim().StartsWith('## [Unreleased]')) {
                  $inUnreleased = $true
                  continue
                }
                if ($inUnreleased) {
                  if ($l.Trim() -match '^##\s+\[') { break }
                  $unreleasedBuf += $l
                }
              }
              $notes = ($unreleasedBuf -join [Environment]::NewLine).Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = (git log -1 --pretty=%B).Trim()
          }

          $bodyFile = Join-Path $env:RUNNER_TEMP 'release_body.md'
          $giteeBodyFile = Join-Path $env:RUNNER_TEMP 'gitee_body.md'

          Set-Content -Path $giteeBodyFile -Value $notes -Encoding utf8

          $ghFullBody = @(
            '## 📝 更新内容',
            '',
            $notes,
            '',
            '## 📦 下载',
            '',
            '| 文件 | 说明 |',
            '| --- | --- |',
            '| `Feisuo-Setup-x64.exe` | Windows x64 安装版（推荐，自动放行防火墙，含桌面/开始菜单快捷方式） |',
            '| `Feisuo-win-x64.exe` | Windows x64 绿色便携版（双击即用，无需安装） |',
            "| `Feisuo-v$ver-arm64.apk` | Android 移动端安装包（适用于 arm64-v8a 架构手机，Android 8.0+） |",
            '',
            '国内用户可在 [Gitee 镜像 Releases](https://gitee.com/huaxudong/feisuo/releases) 页面高速下载。',
            '',
            '## 🔄 自动更新',
            '',
            '飞梭桌面端内置版本检查，**Gitee 优先、GitHub 降级**：',
            '托盘右键「检查更新…」或「系统设置 → 关于与更新」均可触发，',
            '静默调度为启动后 8 秒首次检查、之后每 12 小时一次。',
            '',
            '## ⚠️ 系统要求',
            '',
            '- **Windows**: Windows 10 1809 (17763) 及以上 / Windows 11，内置 WebView2 Runtime',
            '- **Android**: Android 8.0 (API 26) 及以上，arm64-v8a 架构'
          ) -join [Environment]::NewLine

          Set-Content -Path $bodyFile -Value $ghFullBody -Encoding utf8

          Add-Content -Path $env:GITHUB_OUTPUT -Value "body_file=$bodyFile"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "gitee_body_file=$giteeBodyFile"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            publish/Feisuo-Setup-x64.exe
            publish/Feisuo-win-x64.exe
            publish/Feisuo-v${{ steps.ver.outputs.version }}-arm64.apk
          body_path: ${{ steps.notes.outputs.body_file }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      # ⚠️ `continue-on-error` 只让**Gitee 镜像**这一步不阻断发版，
      # 因为 GitHub Release 已经建好、用户已经能下载了 —— 镜像失败不该
      # 让整个发版显示为失败。
      #
      # 代价是这个步骤的失败**不在 job 状态里**，只能看日志。
      # 所以脚本内部对关键失败用 `throw` + `::error::` 显式标注，
      # 并且客户端已经能自愈：Gitee 说"有新版却没附件"时会报明确错误，
      # 而"Gitee 说已是最新但 GitHub 更新"现在会被探测出来并改用 GitHub。
      - name: Sync Release to Gitee
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'soldier-cv/feisuo'
        continue-on-error: true
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if (-not $env:GITEE_TOKEN) {
            # `::error::` 而不是 `::warning::`：没有 token 意味着**国内用户拿不到
            # 高速通道**，而客户端是 Gitee 优先的。这不是可以忽略的小事，
            # 必须在 Actions 页面上一眼可见。
            Write-Host "::error::未配置 GITEE_TOKEN Secret，Gitee 镜像发布被跳过。国内用户将只能走 GitHub（常超时）。请在 GitHub 仓库 Settings → Secrets 添加 GITEE_TOKEN。"
            exit 0
          }

          $tag = "${{ github.ref_name }}"
          $ver = '${{ steps.ver.outputs.version }}'
          $owner = "huaxudong"
          $repo = "feisuo"
          $token = $env:GITEE_TOKEN
          $setup = (Resolve-Path "publish/Feisuo-Setup-x64.exe").Path
          $exe = (Resolve-Path "publish/Feisuo-win-x64.exe").Path
          $apk = (Resolve-Path "publish/Feisuo-v${ver}-arm64.apk" -ErrorAction SilentlyContinue)
          $giteeBodyPath = "${{ steps.notes.outputs.gitee_body_file }}"
          $giteeBody = if (Test-Path $giteeBodyPath) {
            Get-Content $giteeBodyPath -Raw -Encoding utf8
          } else {
            "局域网极速传输工具（Windows 安装版与绿色版 / Android 端）。国内高速下载。"
          }

          $filesToUpload = @($setup, $exe)
          if ($apk) { $filesToUpload += $apk.Path }

          Write-Host "正在准备同步 Release 到 Gitee ($owner/$repo, Tag: $tag)..."

          # 确保 tag 已经存在于 Gitee 仓库
          try {
            git remote add gitee "https://huaxudong:$token@gitee.com/$owner/$repo.git"
          } catch {}
          try {
            git push gitee "HEAD:refs/tags/$tag" --force
            Write-Host "Tag $tag 推送至 Gitee 成功"
          } catch {
            Write-Host "推送到 Gitee Tag 提示: $_"
          }

          $releasesUrl = "https://gitee.com/api/v5/repos/$owner/$repo/releases"
          $releaseId = $null

          # 1. 使用 curl 发送表单创建 Gitee Release（规避 Gitee WAF 对 JSON POST 的 400 拦截）
          try {
            Write-Host "正在向 Gitee 发送创建 Release 请求 ($tag)..."
            $createJson = & curl.exe -s -S -X POST $releasesUrl `
              -F "access_token=$token" `
              -F "tag_name=$tag" `
              -F "target_commitish=main" `
              -F "name=Feisuo $tag" `
              -F "body=$giteeBody" `
              -F "prerelease=false"
            Write-Host "Gitee 创建 Release 响应: $createJson"
            if ($createJson) {
              $respObj = $createJson | ConvertFrom-Json -ErrorAction SilentlyContinue
              if ($respObj -and $respObj.id) {
                $releaseId = $respObj.id
                Write-Host "Gitee 创建 Release 成功，ID: $releaseId"
              }
            }
          } catch {
            Write-Host "Gitee 创建 Release 异常: $_"
          }

          # 2. 如果创建未返回 id（如已存在），则尝试查询该 tag 已有的 release 并更新版本说明
          if (-not $releaseId) {
            try {
              $queryUrl = "$releasesUrl/tags/$tag`?access_token=$token"
              Write-Host "正在查询已有 Release: $queryUrl"
              $existing = Invoke-RestMethod -Uri $queryUrl -Method Get
              if ($existing -and $existing.id) {
                $releaseId = $existing.id
                Write-Host "找到已有 Gitee Release ID: $releaseId，正在更新版本说明..."
                try {
                  $patchJson = & curl.exe -s -S -X PATCH "$releasesUrl/$releaseId" `
                    -F "access_token=$token" `
                    -F "tag_name=$tag" `
                    -F "name=Feisuo $tag" `
                    -F "body=$giteeBody"
                  Write-Host "Gitee Release 描述已刷新为最新说明"
                } catch {
                  Write-Host "Gitee Release 描述更新提示: $_"
                }
              }
            } catch {
              $errDetail = if ($_.ErrorDetails) { $_.ErrorDetails.Message } else { $_.Exception.Message }
              Write-Host "查询已有 Gitee Release 响应: $errDetail"
            }
          }

          # 3. 如果成功获取到 Release ID，上传安装包附件
          if ($releaseId -and (Test-Path $exe)) {
            $attachUrl = "https://gitee.com/api/v5/repos/$owner/$repo/releases/$releaseId/attach_files"

            foreach ($uploadFile in $filesToUpload) {
              $fileName = [System.IO.Path]::GetFileName($uploadFile)

              # 检查并清理同名旧附件（防止 400 冲突）
              try {
                Write-Host "检查 Release (ID: $releaseId) 是否已存在同名附件 $fileName ..."
                $existingAttaches = Invoke-RestMethod -Uri "$attachUrl`?access_token=$token" -Method Get
                foreach ($att in @($existingAttaches)) {
                  if ($att.name -eq $fileName) {
                    Write-Host "发现已有同名附件 (ID: $($att.id))，正在清理以便重新上传..."
                    Invoke-RestMethod -Uri "$attachUrl/$($att.id)`?access_token=$token" -Method Delete
                    Write-Host "旧附件删除成功: $fileName"
                  }
                }
              } catch {
                $errDetail = if ($_.ErrorDetails) { $_.ErrorDetails.Message } else { $_.Exception.Message }
                Write-Host "检查/清理已有附件提示: $errDetail"
              }

              $normPath = $uploadFile.Replace('\', '/')
              $uploaded = $false
              $lastUploadResp = ""
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                Write-Host "正在上传文件到 Gitee Release (ID: $releaseId, 尝试 $attempt/3): $uploadFile ..."
                $uploadResp = & curl.exe -s -S `
                  -X POST "$attachUrl`?access_token=$token" `
                  -F "access_token=$token" `
                  -F "file=@$normPath;filename=$fileName;type=application/octet-stream"
                $curlExit = $LASTEXITCODE
                $lastUploadResp = $uploadResp
                Write-Host "Gitee 响应 ($fileName): $uploadResp"

                if ($curlExit -eq 0 -and $uploadResp) {
                  $respObj = $uploadResp | ConvertFrom-Json -ErrorAction SilentlyContinue
                  if ($respObj -and ($respObj.id -or $respObj.browser_download_url)) {
                    Write-Host "✅ Gitee 附件 $fileName 上传成功 (ID: $($respObj.id))"
                    $uploaded = $true
                    break
                  }
                }
                Write-Warning "第 $attempt 次上传未成功 (curlExit=$curlExit)，等待 3 秒后重试..."
                Start-Sleep -Seconds 3
              }

              if (-not $uploaded) {
                throw "Gitee 附件上传失败（curl 退出码 $curlExit）。Gitee 响应: $lastUploadResp。已建好的 Release 没有附件，客户端会报『发现新版本但没有附件』—— 请手动到 Gitee 后台补传，或删除该 Release。"
              }
            }
            Write-Host "`nGitee Release 全部附件上传完毕！"
          } else {
            # 这里必须 throw：Release 可能**已经被建出来了**，只是没拿到 id。
            # 那就留下一个"有 Release、无附件"的空壳 —— 客户端每次检查更新
            # 都会命中它、报"发现新版本但没有附件"，而 GitHub 上其实有完整版本。
            # 早先只 Write-Warning，镜像就这么半死不活地留着。
            throw "未能获取到有效的 Gitee Release ID (releaseId=$releaseId, exeExists=$(Test-Path $exe))，附件未上传。若 Release 已创建，请到 Gitee 后台补传产物或删除该 Release。"
          }
